<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" fill="#000000" rx="80"/>
  <defs>
    <linearGradient id="gear-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear -->
  <path d="M 256 120 L 280 140 L 300 130 L 310 150 L 335 155 L 340 180 L 365 195 L 360 220 L 380 240 L 370 265 L 385 285 L 365 305 L 370 330 L 345 345 L 340 370 L 315 375 L 305 395 L 280 385 L 256 405 L 232 385 L 207 395 L 197 375 L 172 370 L 167 345 L 142 330 L 147 305 L 127 285 L 142 265 L 127 240 L 147 220 L 142 195 L 167 180 L 172 155 L 197 150 L 207 130 L 232 140 Z" 
        fill="url(#gear-gradient)" 
        opacity="0.9"/>
  
  <!-- Rocket Body -->
  <ellipse cx="330" cy="240" rx="45" ry="90" fill="#FFFFFF" transform="rotate(-45 330 240)"/>
  
  <!-- Rocket Window -->
  <circle cx="345" cy="210" r="12" fill="#000000"/>
  
  <!-- Rocket Flame -->
  <path d="M 280 290 Q 270 310 275 330 Q 280 320 285 330 Q 290 310 280 290 Z" 
        fill="url(#flame-gradient)"/>
</svg>
