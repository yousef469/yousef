<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear - Much Larger -->
  <g transform="translate(256, 256)">
    <!-- Gear body -->
    <circle r="140" fill="url(#gear-grad)" opacity="0.95"/>
    
    <!-- Gear teeth -->
    <g fill="url(#gear-grad)">
      <rect x="-20" y="-160" width="40" height="30" rx="5"/>
      <rect x="-20" y="130" width="40" height="30" rx="5"/>
      <rect x="130" y="-20" width="30" height="40" rx="5"/>
      <rect x="-160" y="-20" width="30" height="40" rx="5"/>
      
      <rect x="-15" y="-160" width="30" height="25" rx="3" transform="rotate(45 0 0)"/>
      <rect x="-15" y="-160" width="30" height="25" rx="3" transform="rotate(-45 0 0)"/>
      <rect x="-15" y="-160" width="30" height="25" rx="3" transform="rotate(135 0 0)"/>
      <rect x="-15" y="-160" width="30" height="25" rx="3" transform="rotate(-135 0 0)"/>
    </g>
    
    <!-- Inner circle -->
    <circle r="100" fill="#000000" opacity="0.3"/>
  </g>
  
  <!-- Rocket - Much Larger and More Visible -->
  <g transform="translate(340, 220) rotate(-45)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="35" ry="75" fill="#FFFFFF"/>
    
    <!-- Rocket nose -->
    <path d="M -35 -75 Q 0 -95 35 -75 Z" fill="#E5E7EB"/>
    
    <!-- Window -->
    <circle cx="0" cy="-40" r="15" fill="#1E293B"/>
    <circle cx="0" cy="-40" r="12" fill="#334155"/>
    <circle cx="-3" cy="-43" r="5" fill="#64748B" opacity="0.6"/>
    
    <!-- Fins -->
    <path d="M -35 50 L -60 75 L -35 70 Z" fill="#E5E7EB"/>
    <path d="M 35 50 L 60 75 L 35 70 Z" fill="#E5E7EB"/>
    
    <!-- Flame -->
    <g transform="translate(0, 75)">
      <ellipse cx="0" cy="0" rx="25" ry="15" fill="url(#flame-grad)" opacity="0.9"/>
      <path d="M -15 0 Q -10 25 0 35 Q 10 25 15 0 Z" fill="url(#flame-grad)"/>
      <path d="M -8 0 Q -5 20 0 28 Q 5 20 8 0 Z" fill="#FEF3C7" opacity="0.8"/>
    </g>
  </g>
</svg>
