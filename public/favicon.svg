<!-- save as favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Engineerium icon">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="60%" stop-color="#7b2cff"/>
      <stop offset="100%" stop-color="#ff2d6f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#ff7a2d"/>
    </linearGradient>
    <!-- small blur for subtle glow (safe for svg favicon) -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>
  
  <!-- dark rounded background circle for contrast (transparent on export if you want) -->
  <rect width="64" height="64" rx="12" ry="12" fill="#0b0b0b"/>
  
  <!-- gear (stroke-free, gradient fill) -->
  <g transform="translate(8,6)" filter="url(#glow)">
    <path d="M24 2c1.2 0 2.2.3 3.2.7l1.5-2.4 3.6 2.2-1.0 2.8c1 .8 1.9 1.8 2.6 2.9l2.8-.5 1.2 3.8-2.8 1.2c.1 1.3.1 2.6 0 3.9l2.8 1.2-1.2 3.8-2.8-.5c-.7 1.2-1.6 2.2-2.6 2.9l1 2.8-3.6 2.2-1.5-2.4c-1 .5-2.1.7-3.2.7s-2.2-.3-3.2-.7L16.6 52l-3.6-2.2 1.0-2.8c-1-.8-1.9-1.8-2.6-2.9l-2.8.5-1.2-3.8 2.8-1.2c-.1-1.3-.1-2.6 0-3.9L6.4 28l1.2-3.8 2.8.5c.7-1.2 1.6-2.2 2.6-2.9l-1-2.8L22.8 8c1 .5 2.1.7 3.2.7z" fill="url(#g1)"/>
    <!-- inner mask circle to make gear ring -->
    <circle cx="24" cy="24" r="12.2" fill="#0b0b0b"/>
  </g>
  
  <!-- rocket silhouette (centered) -->
  <g transform="translate(16,10) scale(0.9)">
    <path d="M24 4c-1.8 0-3.2 1.1-4.2 2.3C18.6 8 16 10 16 13c0 1.2.3 2.2.9 3.2L10 24l5 6 7-3.5C23.6 31 27 32 30 32c3 0 6.4-1 8-2.5L45 28l-6.9-7.8c.6-.9.9-2 .9-3.2 0-3-2.6-5-3.8-6.7C33.2 5.1 31.8 4 30 4h-6z" fill="#ffffff"/>
    <!-- rocket window -->
    <circle cx="30" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
    <!-- flame -->
    <path d="M22 34c1.8 3.2 4.5 5 8 5 2.1 0 4-1 5.8-2.7-1 2-3.2 4.2-7 5.6-3.8 1.4-8.4.5-11-3-1-1.3-1.4-3.1-.8-4.9z" fill="url(#flame)"/>
  </g>
</svg>
