<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="50%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#C084FC"/>
    </linearGradient>
  </defs>
  
  <!-- Gear Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient)"/>
  
  <!-- Gear Teeth -->
  <path d="M50,5 L55,10 L50,15 M85,25 L90,30 L85,35 M95,50 L90,55 L95,60 M85,75 L90,70 L85,65 M50,95 L55,90 L50,85 M15,75 L10,70 L15,65 M5,50 L10,55 L5,60 M15,25 L10,30 L15,35" 
        stroke="url(#gradient)" 
        stroke-width="3" 
        fill="none"/>
  
  <!-- Rocket -->
  <path d="M60,35 L70,50 L65,60 L60,58 L60,35 Z" fill="white"/>
  <circle cx="65" cy="45" r="3" fill="#1e293b"/>
  
  <!-- Flame -->
  <path d="M60,58 L58,65 L60,70 L62,65 Z" fill="#FCD34D"/>
