  <body>
    <div id="root"></div>
    
    <!-- Epic Loading Screen -->
    <div id="loading-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    ">
      <!-- Animated Background Grid -->
      <div style="
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: gridMove 20s linear infinite;
      "></div>
      
      <!-- Glowing Orbs -->
      <div style="position: absolute; top: 20%; left: 10%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, transparent 70%); border-radius: 50%; filter: blur(40px); animation: float 6s ease-in-out infinite;"></div>
      <div style="position: absolute; bottom: 20%; right: 10%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); border-radius: 50%; filter: blur(40px); animation: float 8s ease-in-out infinite reverse;"></div>
      
      <!-- Main Content -->
      <div style="position: relative; z-index: 10; text-align: center;">
        <!-- Animated Logo Container -->
        <div style="position: relative; width: 120px; height: 120px; margin: 0 auto 30px;">
          <!-- Rotating Ring -->
          <div style="
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
          "></div>
          <div style="
            position: absolute;
            inset: 8px;
            border: 3px solid transparent;
            border-right-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
          "></div>
          <div style="
            position: absolute;
            inset: 16px;
            border: 3px solid transparent;
            border-bottom-color: #06b6d4;
            border-radius: 50%;
            animation: spin 2.5s linear infinite;
          "></div>
          
          <!-- Center Icon (Rocket) -->
          <div style="
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
          ">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: rocketPulse 2s ease-in-out infinite;">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
              <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
            </svg>
          </div>
        </div>
        
        <!-- Brand Name -->
        <h1 style="
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 2.5rem;
          font-weight: 800;
          background: linear-gradient(135deg, #22d3ee 0%, #8b5cf6 50%, #06b6d4 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin: 0 0 12px 0;
          letter-spacing: -0.02em;
        ">Engineerium</h1>
        
        <!-- Tagline -->
        <p style="
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 1rem;
          color: rgba(148, 163, 184, 0.8);
          margin: 0 0 40px 0;
          font-weight: 500;
        ">Engineering in 3D</p>
        
        <!-- Loading Bar -->
        <div style="
          width: 200px;
          height: 4px;
          background: rgba(34, 211, 238, 0.2);
          border-radius: 4px;
          overflow: hidden;
          margin: 0 auto;
        ">
          <div style="
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #22d3ee, #8b5cf6, #22d3ee);
            background-size: 200% 100%;
            border-radius: 4px;
            animation: loadingBar 1.5s ease-in-out infinite;
          "></div>
        </div>
        
        <!-- Loading Text -->
        <p style="
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 0.875rem;
          color: rgba(148, 163, 184, 0.6);
          margin: 16px 0 0 0;
          animation: pulse 2s ease-in-out infinite;
        ">Initializing systems...</p>
      </div>
      
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0) scale(1); }
          50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes rocketPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.8; }
        }
        @keyframes loadingBar {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(150%); }
          100% { transform: translateX(400%); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
        @keyframes gridMove {
          0% { transform: translate(0, 0); }
          100% { transform: translate(50px, 50px); }
        }
      </style>
    </div>
    
    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('loading-screen');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(function() {
              loader.remove();
            }, 500);
          }
        }, 800);
      });
    </script>
    
    <!-- FingerprintJS Pro (optional - for better accuracy) -->
    <script>
      // Load FingerprintJS if API key is available
      (function() {
        const fpKey = 'VITE_FINGERPRINT_API_KEY'; // Will be replaced by env var
        if (fpKey && fpKey !== 'VITE_FINGERPRINT_API_KEY') {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs-pro@3/dist/fp.min.js';
          script.async = true;
          document.head.appendChild(script);
        }
      })();
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Cleanup & Cache Clear -->
    <script>
      // Aggressively unregister service workers and clear caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      
      // Clear all caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
      
      // Force reload from server (bypass cache)
      if (performance.navigation.type !== 1) {
        const lastVersion = localStorage.getItem('app-version');
        const currentVersion = '2.0.7';
        
        if (lastVersion !== currentVersion) {
          localStorage.setItem('app-version', currentVersion);
          window.location.reload(true);
        }
      }
    </script>
